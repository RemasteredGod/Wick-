name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include personal data here. Use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Wick version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Popup
        - Claude sidebar
        - Toolbar icon
        - Notifications
        - Leaderboard join or leave
        - Public website
        - Build or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use placeholder accounts and redact email addresses, tokens, organisation IDs, and conversation content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome version, operating system, Claude plan if relevant
