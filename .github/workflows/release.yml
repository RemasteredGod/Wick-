name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag in the exact form vX.Y.Z
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Check out the existing release tag
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: corepack install --global pnpm@10.33.4

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run full validation
        run: |
          pnpm test
          pnpm typecheck
          pnpm exec tsc --project tsconfig.vercel.json --noEmit

      - name: Build and verify unpacked extension
        run: |
          pnpm build
          pnpm verify:build

      - name: Package and verify deterministic extension
        run: |
          pnpm package
          pnpm verify:package
          node scripts/package-extension.mjs dist artifacts/wick-repeat.zip
          node scripts/verify-extension-package.mjs artifacts/wick-repeat.zip dist
          cmp "artifacts/wick-${RELEASE_TAG#v}.zip" artifacts/wick-repeat.zip
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Generate release notes and checksum
        run: |
          mkdir -p artifacts/release-candidate
          cp "artifacts/wick-${RELEASE_TAG#v}.zip" artifacts/release-candidate/
          node scripts/release-notes.mjs \
            --tag "$RELEASE_TAG" \
            --archive "artifacts/release-candidate/wick-${RELEASE_TAG#v}.zip" \
            --notes-file artifacts/release-candidate/release-notes.md \
            --checksum-file "artifacts/release-candidate/wick-${RELEASE_TAG#v}.zip.sha256"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Record candidate commit
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve reviewed release candidate
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: artifacts/release-candidate/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Restore reviewed release candidate
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate
          path: release-candidate

      - name: Verify candidate and create draft release
        shell: bash
        run: |
          set -euo pipefail
          cd release-candidate
          sha256sum --check "wick-${RELEASE_TAG#v}.zip.sha256"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "$remote_sha" = "$CANDIDATE_SHA"
          gh release create "$RELEASE_TAG" \
            "wick-${RELEASE_TAG#v}.zip" \
            "wick-${RELEASE_TAG#v}.zip.sha256" \
            --draft \
            --verify-tag \
            --target "$CANDIDATE_SHA" \
            --title "Wick ${RELEASE_TAG}" \
            --notes-file release-notes.md
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
